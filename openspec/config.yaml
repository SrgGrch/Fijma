schema: spec-driven

context: |
  Пиши артефакты на русском языке.
  Исходный дизайн-документ: figma-mcp-design-v0.2.md; учитывай согласованные решения D1–D5.
  MVP: локальный MCP-сервер (stdio) и development-плагин Figma Desktop через loopback WebSocket;
  один владелец и один привязанный документ. Строгие инструменты сохраняются; согласованное изменение
  universal-executor добавляет отдельный opt-in доверенный JavaScript/TypeScript без гарантий sandbox/read-only.
  Полный доступ к текущему документу без подтверждений сохраняет валидацию, защиту канала и границы сессии.
  Локальные компоненты, стили и переменные входят в MVP; внешние библиотеки, прототипирование,
  сложные векторы, удалённый доступ и несколько документов или агентов отложены.
  Открытые технические проверки из дизайн-документа не считай подтверждёнными гарантиями платформы.
