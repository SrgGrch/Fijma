<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проверка Undo</title></head><body>
<h2>Проверка Undo</h2>
<p>Только для отдельного тестового файла. Каждая кнопка создаёт прямоугольник и вызывает commitUndo.</p>
<button id="batch-a">Пакет A</button>
<button id="batch-b">Пакет B</button>
<button id="partial">Частичный шаг</button>
<p id="result" role="status"></p>
<p>«Частичный шаг» имитирует остановку после первого изменения, без автоматического отката.</p>
<script>
for (const id of ['batch-a', 'batch-b', 'partial']) {
  document.getElementById(id).onclick = () => parent.postMessage({ pluginMessage: { type: id } }, '*');
}
onmessage = (event) => {
  const m = event.data.pluginMessage;
  if (m && m.type === 'result') document.getElementById('result').textContent = `Создан ${m.name}${m.partial ? '; следующий шаг пропущен' : ''}`;
};
</script></body></html>
